name: daily-quotes

on:
  schedule:
    - cron: "20 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pykrx
        run: python -m pip install --upgrade pip pykrx
      - name: Live prices
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
        run: python scripts/daily-refresh.py
      - name: Fundamentals and monthly range
        run: |
          python scripts/enrich-item-summary.py
          python scripts/enrich-fundamentals.py
          python scripts/enrich-monthly.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quotes.generated.json
          git diff --cached --quiet || git commit -m "chore: daily quote and fundamental refresh"
          git push
